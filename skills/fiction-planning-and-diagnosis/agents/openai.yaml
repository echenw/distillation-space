interface:
  display_name: "小说规划、诊断与自检"
  short_description: "定赛道、规划新作、起草、诊断成稿、修订删减，成稿自检、事实核验和读者反馈"
  default_prompt: "请先问清篇幅、媒介、类型和交付方式，再按我的素材、构思或稿子做规划、起草、诊断、修订、事实核验或反馈处理；材料不全时给出标明“假设”或“暂定”的方案，最多问我三个问题。"
policy:
  allow_implicit_invocation: false
