interface:
  display_name: "异世界与穿越·机制诊断（批次-01）"
  short_description: "诊断与设计穿越/异界/乌托邦小说的入口、出口、代价与制度差异"
  icon: portal
  category: writing
  language: zh-CN

branding:
  accent_color: "#5B4B8A"
  badge: "27 sources · verified"

default_prompt: >-
  用 isekai-crossworld-craft-b01 检查我这部小说的越界机制：先确认入口类型、可返回性与代价是否前置，
  再逐条跑规则体检，并给出至少一条本批次内的反例。

first_message: >-
  我会先要六项 intake 信息：越界类型（装置/灾害/器物/无入口/内心投射）、可返回性（可/不可/返回即损失）、
  代价是否已前置、世界是否承认主角的因果律、制度差异清单、你想要的产出类型。
  缺任何一项我会先问你，不会替你假定。

capabilities:
  - mechanism-intake
  - rules-audit
  - counterexample-lookup
  - institution-design

labels:
  - 异世界
  - 穿越
  - 乌托邦
  - 规则自洽
  - 小说诊断
