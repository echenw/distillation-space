interface:
  display_name: "身份·复仇·权谋 小说机制工作台"
  short_description: "诊断与设计冒名顶替、秘密暴露、派系权谋与复仇代价的小说机制"
  description: >-
    面向"身份置换 / 复仇清算 / 权力机器"题材的小说写作与改稿：判定权力轴、
    检查伪装契约与信息不对称、拆解派系的出资/记档/广播三部件、核算复仇代价与结算形态。
    基于 16 部来源的逐本阅读与融合（任务 B-07-B03），每条规则可回查到作品与行号；
    保留跨作品冲突，不把单部作品的情节升格为通用规则。
  category: "写作"
  default_prompt: "帮我诊断这部小说的身份/复仇/权谋机制：先判定它属于哪条权力轴，再检查伪装契约、广播机构与代价账本。"
  negative_triggers:
    - "现实政治、选举或组织斗争的操作建议"
    - "非小说文体且不涉身份/复仇/权谋机制"
    - "没有给出任何正文或设定就要求直接续写"
    - "要求把某一部作品的情节当作所有作品必须遵守的规则"
