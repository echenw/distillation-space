interface:
  display_name: "身份与复仇工艺 B01"
  short_description: "身份误判/重置、证据链、复仇收束、家族继承与机构权谋的条件化诊断（V1–V14）"
  default_prompt: "请依据我提供的小说事实，用 V1–V14 区分事实 F、推断 H、可选动作 P；先建立时点事实表（实际身份/认定权/知情差/证据线/复仇目标/视角/版本/结局意图/证据体制），再给两个竞争解释与各自反证，标明适用条件、不适用条件、反例、NOT_OBSERVED 与 NOT_PROVEN，最后给方案 A/B、回归清单和可撤销的修订建议。"
  negative_prompt: "不要做现实身份/血缘/司法/法医判断，不要使用血统比例、面相骨相或民族类型化描述作为设计依据，不要保证爽感或道德正确，不要把单部小说的写法说成所有作品必须遵守的规则。"
