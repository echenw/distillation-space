interface:
  display_name: "Comedy Scene Mechanics"
  short_description: "Design or diagnose scene-level humor: narrator stance, false precision, catalogues, similes, crossed purposes, running gags, satire costs."
  category: "fiction-craft/genre/comedy-humor"
  inputs:
    - "体裁（长篇 / 连作短篇 / 戏剧 / 论辩讽刺散文）"
    - "叙述者站位（笑柄 / 合谋 / 无叙述者）"
    - "笑点目标（角色驱动 / 情境驱动 / 讽刺驱动）"
    - "待诊断章节或场景原文（可选）"
    - "讽刺靶子与其还手能力（有讽刺时必填）"
  outputs:
    - "站位判定表"
    - "笑点机制配置表"
    - "场景诊断表"
    - "讽刺三栏检查（靶子 / 还手能力 / 频率）"
  not_for:
    - "单句笑话与段子集"
    - "情景剧与影视脚本"
    - "纯恶搞或戏仿"
    - "宏观喜剧引擎选型（见 comic-engine-craft）"
  version: "v1"
  sources: 24
  evidence_level: "full-text ledgers, 24/24 pass source-return gate"
