# 界面信息与选择提示；宿主是否加载、采用哪些字段，以实际宿主为准。
# 本文件不授予权限，也不承诺自动执行；实际能力受宿主工具与用户授权限制。
interface:
  display_name: "人物塑造与叙事控制"
  short_description: "视角与叙述距离、信息控制与证词、人物心理的呈现、场景与概述、非线性时间"
  default_prompt: "请先问清这本书或这一场关于谁、想让读者知道什么、哪些不能改，再按我的构思或稿子设计、诊断或改写视角、信息安排、人物心理或时间结构；材料不全时给出标明“假设”的草案，最多问我三个问题。"
policy:
  allow_implicit_invocation: false
