# 界面信息与选择提示；宿主是否加载、采用哪些字段，以实际宿主为准。
# 本文件不授予权限，也不承诺自动执行；实际能力受宿主工具与用户授权限制。
interface:
  display_name: "场景设计与冲突节奏"
  short_description: "场景的进出与约束、伏笔悬念与节奏、章末与结尾、打斗与后果"
  default_prompt: "请先问清这一场或这一章要什么效果、哪些不能改，再按我的构思或稿子设计、诊断或改写场景、伏笔、节奏或打斗；材料不全时给出标明“假设”的草案，最多问我三个问题。"
policy:
  allow_implicit_invocation: false
