interface:
  display_name: "荒野求生与灾变（孤岛/极地/海难/瘟疫）"
  short_description: "把绝境写成一个读者能自己核算、能预判崩盘、能看见代价的结构。"
  icon_small: "./assets/icon-small.png"
  icon_large: "./assets/icon-large.png"
  brand_color: "#2F6F4E"
  default_prompt: >
    我要写/改一段荒野求生或灾变情节（孤岛、海难、极地、雪地、瘟疫或末日据点）。
    先按温度带、介质、夜间威胁、时间尺度定档，再按 R-A…R-K 给我可执行的检查项，
    每条附来源锚点（PG 编号 + 行号），并标出 SINGLE_SOURCE 与 NOT_PROVEN 的条目。
    不要把书中做法当现代野外手册。
  suggested_prompts:
    - "我的主角流落热带荒岛第一天，该按什么顺序做事？"
    - "帮我校对：这段求生戏里资源是不是凭空出现的？"
    - "给这个孤岛据点做一次'能封 / 能退'检查。"
    - "这场暴风雪的倒计时怎么写得能被读者复核？"
    - "搜救队和落难者擦肩而过，怎么写才不像巧合？"
  category: "类型小说专项"
  tags:
    - 荒野求生
    - 海难
    - 孤岛
    - 极地
    - 灾变
    - 资源账
    - 故事结构
  task_id: "A-08-B01"
  source_count: 28
  source_period: "1882–1951（公版 Project Gutenberg 全文）"
