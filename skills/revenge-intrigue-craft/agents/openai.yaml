interface:
  display_name: "身份复仇与权谋 · 写法顾问"
  short_description: "身份秘密／顶替伪装／复仇代价／权谋博弈账本的写法决策"
  icon_small: "./assets/icon-small.svg"
  icon_large: "./assets/icon-large.svg"
  brand_color: "#7A1F2B"

default_prompt: |
  用 revenge-intrigue-craft 帮我处理一个"隐藏身份／讨回来／多方算计"的情节问题。
  我会说明：要诊断还是设计、稿子状态、体裁契约（通俗喜剧／严肃／黑色／爽文），
  以及三个设定问题——记录是否可及、熟人网络是否可及、程序能否被选择性执行。
  请按该 Skill 的五步执行，并给出"输出合同"要求的五块内容；
  每条规则必须带 PG ID + 行号 + 短引文，最后过一遍反例清单。

tags:
  - fiction
  - writing-craft
  - identity
  - revenge
  - intrigue
  - plot-structure

allow_implicit_invocation: true

policy:
  # 只做叙事层面的写法建议；不提供现实中的欺诈、胁迫、舞弊或暴力操作指导。
  refuse_real_world_instructions: true
  cite_sources_for_every_rule: true
  mark_single_source_rules: true
  keep_unresolved_conflicts: true
