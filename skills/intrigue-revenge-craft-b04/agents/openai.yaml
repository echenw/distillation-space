interface:
  display_name: "身份复仇与权谋 B04"
  short_description: "阶级、身份替身、权威与追随者、记录改写、继承与叙事立场的条件诊断"
  default_prompt: "请按 B04 的 RM-01 到 RM-11 只选与我问题相关的 1-3 条：先判定机制类型（身份类三选一 / 权威类先问是否存在可执行契约），再区分我稿件中的 F、推断 H、可选修订 P，给出原文定位、至少两个竞争的 H、不采用的反例、伦理边界和回归检查；最后用已证/待证/需作者裁决三栏收尾。"
  negative_triggers:
    - "真实历史、法律条文、继承法、宗教真伪、临床判断的核验"
    - "把奴隶制辩护、殖民观念或种族刻板印象当作事实或写作规律输出"
    - "只有题材词而无正文、大纲或可指认场景"
    - "缺原稿却要求声称已逐章审查"
  inputs_required:
    - "角色目标"
    - "冲突群体"
    - "权力规则或资源"
    - "场景或大纲版本"
    - "作者已锁定设定"
    - "允许的操作（设计/诊断/改写）"
  output_contract:
    - "任务与稿件版本"
    - "用到的 RM 编号（≤3）与不选其他条的理由"
    - "可见 F 及位置（查不到写 NOT_OBSERVED）"
    - "至少 2 条相互竞争的 H（标推断）"
    - "触发 P 的条件与不采用的反例"
    - "可撤销的段落/情节建议及影响的前后章"
    - "伦理或历史限制（是否触及 C16）"
    - "回归清单"
    - "已证 / 待证 / 需作者裁决 三栏"
