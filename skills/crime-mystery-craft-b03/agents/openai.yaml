interface:
  name: crime-mystery-craft-b03
  display_name: "推理悬疑刑侦写作工艺 · 批次-03"
  short_description: "设计或诊断推理/悬疑小说的线索、空间与结局契约"
  language: zh-CN
  default_prompt: >-
    我要写/在改一个推理悬疑案件。先帮我判定读者契约（可解型还是氛围型）、
    不可能性来源和收尾契约，再给我案件设计表、线索记账表和逐条动作清单。
policy:
  allow_markdown: true
  allow_file_read: true
  allow_file_write: false
  allow_shell: false
  max_reference_files: 3
inputs:
  required_one_of:
    - "已有设定：案件类型 / 侦探类型 / 篇幅"
    - "已有稿子：案发场景、嫌疑人名单、读者已知线索清单、当前揭晓段落"
  optional:
    - "目标契约偏好（可解型 / 氛围型）"
    - "是否要求'不可能'成分（密室、视域错位、反向现场）"
    - "想参考的代表作品或年代"
triggers:
  - "设计一个推理/悬疑/刑侦案件的骨架"
  - "我的揭晓太弱 / 读者提前猜到了 / 密室立不住 / 物证链断了"
  - "密室、不可能犯罪、视线错位怎么设计"
  - "自白能不能用来结案 / 结尾要不要闭合"
  - "侦探怎么入局、能隐瞒什么"
negative_triggers:
  - "真实案件侦查、法律咨询、报警或取证建议"
  - "现代法医、DNA、数字取证的程序性问题"
  - "要求'保证读者猜不到'"
  - "询问某位作者的真实创作意图"
outputs:
  - "判定：读者契约 + 不可能性来源 + 收尾契约"
  - "案件设计表（SKILL.md §7 模板）"
  - "线索记账表（线索 × 位置 × 可见性 × 复原者）"
  - "动作清单（每条标注引用的 R 编号与失效条件）"
metadata:
  skill_id: crime-mystery-craft-b03
  task_id: A-03-B03
  category: 16-类型小说专项/01-推理悬疑刑侦/批次-03
  sources: 30
  trusted_full: 27
  sources_not_full: 0
  independent_evidence_families: 23
  covered_lines: 254635
  material_role: FICTION_CASE (30/30)
  round: round-p4-final-2026-10-30
  p5_status: NOT_PROVEN
  rights:
    summary: "全部来源为 Project Gutenberg 官方版/公共镜像的英文小说；权利状态逐书不同，均非法律结论。"
    labels: "A=官方版需逐书核验；B=官方目录+公共镜像需逐书核验；C=镜像源+已筛头部声明；D=官方页声明美国公域；E=镜像头部筛过（非法律意见）"
    per_source_table: "references/05-source-index.md §权利与许可"
    obligation: "引文/摘录用于出版、商用或再分发前，须按目标司法辖区逐书独立核验权利。"
  notes:
    - "全部规则为 H（由叙事现象升格），不得表述为作者讲授的方法"
    - "Hume×6、White×2、Lincoln×2 按来源族去重计权"
    - "PG68810 含时代种族主义内容，仅作负例"
