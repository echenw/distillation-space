interface:
  display_name: "言情爱情·关系机制诊断与写作"
  short_description: "诊断爱情线的阻挡力、追求与拒绝、中间人与结局形态，全部结论可回源到 18 部原著行号。"
  icon_small: "static/icon-small.png"
  icon_large: "static/icon-large.png"
  brand_color: "#C2185B"
  default_prompt: "用 romance-craft-b03-b07 帮我诊断这条爱情线：它是主负荷关系吗？阻挡力有几条、分别落在谁身上？如果要写拒绝场景，礼节层/理由层/动机自陈层各给一句。最后在封闭/停止/悬置三种结局里选一种并说明理由。"
  sample_prompts:
    - "这条爱情线读起来假，帮我诊断张力卡在哪，并给出可回源到原著行号的改法。"
    - "我要写一个被拒绝的告白场景，按礼节层/理由层/动机自陈层各写一句。"
    - "这对情侣要不要复合？先回答：伤害有没有改变当事人的自我理解。"
    - "我要加一个撮合者，帮我判断他的动机属于服务当事人还是满足自己的戏剧感。"
    - "我的爱情线只有外部反对者，没有主角自己的取舍，会有什么问题？"
    - "结局在封闭/停止/悬置三种里选一种，说明代价。"
