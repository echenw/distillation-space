# 界面信息与选择提示；宿主是否加载、采用哪些字段，以实际宿主为准。
# 本文件不授予权限，也不承诺自动执行；实际能力受宿主工具与用户授权限制。
interface:
  display_name: "Plot Architecture（情节架构）"
  short_description: "规划、诊断、修订虚构作品的情节架构：人工填表、条件分支、失败出口；不自动改稿。"
  default_prompt: "请用 plot-architecture 处理我提供的情节材料：先判断是规划、诊断还是修订，再按对应 reference 走；缺少原文时只给检查清单，不要虚构诊断。"
policy:
  allow_implicit_invocation: false
