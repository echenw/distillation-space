# 界面信息与选择提示；宿主是否加载、采用哪些字段，以实际宿主为准。
# 本文件不授予权限，也不承诺自动执行；实际能力受宿主工具与用户授权限制。
interface:
  display_name: "预设卡生成"
  short_description: "小说创作提示词预设卡：推进模式卡、文风卡、表达约束卡的生成、诊断与修订；按推进／文风／表达三轴审章节。只接产物是给模型用的卡或按三轴做的诊断"
  default_prompt: "请先说清要什么卡（推进模式卡、文风卡还是表达约束卡）、给哪类小说用、有没有样文和已锁定的旧卡，再按我的材料生成、诊断或修订卡，或按三轴诊断一章；材料不全时先问，最多问三个问题，锁定内容冲突时不擅自覆盖。"
policy:
  allow_implicit_invocation: false
