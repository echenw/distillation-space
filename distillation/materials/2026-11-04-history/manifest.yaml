# 材料批次清单：v0–v3 历史版本登记
# 只登记提交 SHA、路径与规模；不复制原件，不放任何作品全文或来源编号。
# 数据由 `git ls-tree -r -l <提交> -- skills` 实测（2026-11-04），非估计值。

batch: 2026-11-04-history
baseline: main@c734510          # 基线不是材料版本；knowledge-compiler 规范依据
read_method: git show <提交>:<路径>   # 只读，不检出、不改仓库

versions:
